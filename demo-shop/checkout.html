<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | FreshMart Lagos</title>
<link rel="stylesheet" href="css/style.css">
<script defer src="js/app.js"></script>
</head>
<body data-page="checkout">
<header><a href="index.html">FreshMart Lagos</a><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></header>
<div class="hero"><img src="img/hero-checkout.webp" width="720" height="488" fetchpriority="high" alt="Almost done"></div>
<main>
<h1>Checkout</h1>
<div id="lines"></div>
<form onsubmit="event.preventDefault(); document.getElementById('done').hidden=false;">
<label for="name">Full name</label><input id="name" type="text" required>
<label for="phone">Phone</label><input id="phone" type="tel" required>
<label for="addr">Delivery address</label><input id="addr" type="text" required>
<p><button type="submit">Place order</button></p>
</form>
<p class="notice" id="done" hidden>Order placed. Thank you!</p>
</main>
</body></html>
