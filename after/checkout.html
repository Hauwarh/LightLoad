<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | FreshMart Lagos</title>
<link rel="stylesheet" href="css/style.css">
<script defer src="js/app.js"></script>
</head>
<body data-page="checkout">
<header class="topbar"><a class="brand" href="index.html"><span class="logo" aria-hidden="true">FM</span><span class="brand-text"><strong>FreshMart Lagos</strong><small>Market prices, delivered</small></span></a><a class="cart-chip" href="cart.html">Cart (<span id="cart-count">0</span>)</a></header>
<main>
<section class="hero"><img src="img/hero-checkout.webp" width="800" height="400" fetchpriority="high" alt="Aerial view of Mile 12 food market, Lagos"><div class="hero-text"><span class="badge">Step 2 of 2</span><h2>Almost done</h2><p>Tell us where to deliver.</p></div></section>
<h1>Checkout</h1>
<div class="panel"><h3 class="panel-title">Order summary</h3><div id="lines"></div></div>
<form class="panel" onsubmit="event.preventDefault(); document.getElementById('done').hidden=false;">
<h3 class="panel-title">Delivery details</h3>
<label for="name">Full name</label><input id="name" type="text" required>
<label for="phone">Phone</label><input id="phone" type="tel" required>
<label for="addr">Delivery address</label><input id="addr" type="text" required>
<p class="pay"><span class="chip-ok">&#10003;</span> Pay on delivery (cash or transfer)</p>
<p><button class="btn-block" type="submit">Place order</button></p>
</form>
<p class="notice" id="done" hidden>Order placed. Thank you!</p>
</main>
</body></html>
